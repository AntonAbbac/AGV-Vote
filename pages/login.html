<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AGV Vote</title>
  <link rel="stylesheet" href="/styles/login.css" />
  <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
  <script src="/pocketbase/login.js"></script>
  <script src="/pocketbase/root.js"></script>
</head>
<body>
  <div class="login-card">
    <div class="top">
      <h1>Login</h1>
    </div>

    <form id="authForm" onsubmit="loginOrRegister(event)">
      <div class="input-group">
        <input class="login" id="email" type="email" name="email" placeholder="Volume de email" required />
        <input class="register" id="password" type="password" name="senha" placeholder="Volume de senha" required />

        <div class="input-login-group">
          <button id="submitBtn" type="submit">Botão de login</button>
        </div>

        <div class="forgot-password">
          <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
        </div>
      </div>
    </form>

    <!-- Modal para reset de senha -->
    <div id="resetModal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h3>Recuperar Senha</h3>
        <p>Digite seu email institucional para receber o link de redefinição:</p>
        <input id="resetEmail" type="email" placeholder="seu@escola.pr.gov.br" />
        <button id="sendResetBtn">Enviar Link</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("submitBtn").addEventListener("click", async function (e) {
      e.preventDefault();
      await loginOrRegister(e);
    });

    const forgotLink = document.getElementById("forgotPasswordLink");
    const resetModal = document.getElementById("resetModal");
    const closeModal = document.getElementById("closeModal");
    const sendResetBtn = document.getElementById("sendResetBtn");

    forgotLink.addEventListener("click", function (e) {
      e.preventDefault();
      resetModal.style.display = "flex";
    });

    closeModal.addEventListener("click", function () {
      resetModal.style.display = "none";
    });

    resetModal.addEventListener("click", function (e) {
      if (e.target === resetModal) resetModal.style.display = "none";
    });

    sendResetBtn.addEventListener("click", async function () {
      await requestPasswordReset();
    });
  </script>
</body>
</html>
